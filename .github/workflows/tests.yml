name: C++ Parser Tests

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Compile Test Suite
      run: |
        g++ -std=c++17 tests/test_main.cpp parser/code/parser.cpp parser/code/tokenizer.cpp parser/code/reader.cpp parser/code/types.cpp Iparser/headers -o test_suite

    - name: Run Tests
      run: ./test_suite
