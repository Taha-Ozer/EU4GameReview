<!DOCTYPE html>
<html lang="en">

<head>
    <title>EU4 Savegame review</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400..900&display=swap" rel="stylesheet">
</head>

<body>
    <div id="leftbar">
        <h2 id="playerName">Prussia</h2>
        <img src="flag.png" alt="Flag">
        <br>
        <table id="countryData">
            <tr>
                <th>Development</th>
                <td id="devValue">0</td>
            </tr>
            <tr>
                <th>Treasury</th>
                <td id="treasuryValue">0</td>
            </tr>
            <tr>
                <th>Income</th>
                <td id="incomeValue">0</td>
            </tr>
            <tr>
                <th>Manpower</th>
                <td id="manpowerValue">0</td>
            </tr>
            <tr>
                <th>Regiments</th>
                <td id="regimentValue">0</td>
            </tr>
            <tr>
                <th>Ships</th>
                <td id="shipValue">0</td>
            </tr>
        </table>
    </div>
    <div id="tabs">
        <button id="GreatPowersTab">Great Powers</button>
        <div id="mainpanel">
            <div id="leaderboard">
                <h2>Great Powers of the world</h2>
                <table id="greatPowers">
                    <tr>
                        <th>Rank</th>
                        <th> </th>
                        <th>Name</th>
                        <th>Development</th>
                    </tr>
                    <tr>
                        <td>1</td>
                        <td></td>
                        <td>Ottomans</td>
                        <td>1500</td>
                    </tr>
                    <tr>
                        <td>2</td>
                        <td></td>
                        <td>France</td>
                        <td>1344</td>
                    </tr>
                </table>
            </div>
            <div id="comparisons">
                <h2>Comparisons</h2>
            </div>
        </div>
    </div>
    <script src="js/index.js" type="module"></script>
</body>

</html>
