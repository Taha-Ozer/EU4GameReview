<!DOCTYPE html>
<html lang="en">

<head>
    <title>EU4 Savegame review</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div id="leftbar">
        <h2>Prussia</h2>
        <img src="flag.png" alt="Flag">
        <br>
        <table id="countryData">
            <tr>
                <th>Development</th>
                <td>0</td>
            </tr>
            <tr>
                <th>Treasury</th>
                <td>0</td>
            </tr>
            <tr>
                <th>Income</th>
                <td>0</td>
            </tr>
            <tr>
                <th>Manpower</th>
                <td>0</td>
            </tr>
            <tr>
                <th>Regiments</th>
                <td>0</td>
            </tr>
            <tr>
                <th>Ships</th>
                <td>0</td>
            </tr>
        </table>
    </div>
    <div id="mainpanel">
        <button id="GreatPowersTab">Great Powers</button>
        <div id="leaderboard">
            <h2>Great Powers of the world</h2>
            <table id="greatPowers">
                <tr>
                    <th>Rank</th>
                    <th> </th>
                    <th>Name</th>
                    <th>Development</th>
                </tr>
                <tr>
                    <td>1</td>
                    <td></td>
                    <td>Ottomans</td>
                    <td>1500</td>
                </tr>
                <tr>
                    <td>2</td>
                    <td></td>
                    <td>France</td>
                    <td>1344</td>
                </tr>
            </table>
        </div>
        <div id="comparisons">COMPARISONS</div>
    </div>
</body>

</html>
