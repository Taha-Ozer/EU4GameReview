<!DOCTYPE html>

<html lang="en">
    <head>
        <title>Dashversalis IV</title>
        <link type="image/x-icon" rel="icon" href="images/favicon.png">
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <header id="top-bar"> <!-- The top bar with info and navigation -->
            <div id="save-name">
                <h2>Savegame name</h2>
            </div>
            <div id="save-date">
                <h2>11/11/1444</h2>
            </div>
            <nav id="navigation">
                <button class="tab-button">Overview</button>
                <button class="tab-button">Great Powers</button>
            </nav>
        </header>
        <main id="main-page"> <!-- The main screen under the top bar-->
            <!-- Section of the country overview -->
            <section id="country-overview">
                <div id="country-info-screen">
                    <div id="country-and-flag">
                        <h1 id="player-name">Austria</h1>
                        <img src="images/Austria_flag.png" alt="Flag of Austria">
                    </div>
                    <div id="ruler-and-tech">
                        <h2>Ruler and Technology</h2>
                        <dl id="ruler-and-tech-data" class="value-list">
                            <dt id="ruler">Ruler</dt>
                            <dd id="ruler-stats">6/6/6</dd>
                            <dt>Admin tech</dt>
                            <dd id="admin-tech">8</dd>
                            <dt>Diplo tech</dt>
                            <dd id="diplo-tech">8</dd>
                            <dt>Mil tech</dt>
                            <dd id="mil-tech">8</dd>
                        </dl>
                    </div>
                </div>
                <!-- The div where the widgets will appear-->
                <div id="widget-screen">
                    <section id="military-widget" class="widget">
                        <h2> Military </h2>
                        <!-- The description list for our military stats -->
                        <dl id="military-data" class="value-list">
                            <dt>Manpower</dt>
                            <dd id="manpower">100k</dd>
                            <dt>Regiments</dt>
                            <dd id="regiment-count">20</dd>
                            <dt>Ships</dt>
                            <dd id="ship-count">15</dd>
                        </dl>
                    </section>
                    <section id="economy-widget" class="widget">
                        <h2> Economy </h2>
                        <!-- The description list for our economy stats -->
                        <dl id="economy-data" class="value-list">
                            <dt>Treasury</dt>
                            <dd id="treasury">1000</dd>
                            <dt>Income</dt>
                            <dd id="income">20</dd>
                            <dt>Development</dt>
                            <dd id="development">200</dd>
                        </dl>
                    </section>
                </div>
            </section>
            <!-- Section of great powers comparisons -->
            <section id="great-powers">

            </section>
        </main>
        <script src="js/main.js" type="module"></script>
    </body>
</html>
